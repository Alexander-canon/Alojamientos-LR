<form class="filtros" (submit)="$event.preventDefault()">
  <label class="filtros__campo">
    <span class="filtros__etiqueta">Ciudad</span>
    <select class="filtros__control" [value]="ciudad" (change)="ciudadChange.emit($any($event.target).value)">
      <option value="">Todas</option>
      @for (ciudad of ciudades; track ciudad) {
        <option [value]="ciudad">{{ ciudad }}</option>
      }
    </select>
  </label>

  <label class="filtros__campo">
    <span class="filtros__etiqueta">Huéspedes</span>
    <input
      class="filtros__control"
      type="number"
      min="1"
      placeholder="Huéspedes"
      [value]="huespedes ?? ''"
      (input)="alCambiarHuespedes($any($event.target).value)"
    />
  </label>

  <label class="filtros__campo">
    <span class="filtros__etiqueta">Tipo</span>
    <select class="filtros__control" [value]="tipo" (change)="tipoChange.emit($any($event.target).value)">
      <option value="">Todos</option>
      @for (tipo of tipos; track tipo) {
        <option [value]="tipo">{{ tipo }}</option>
      }
    </select>
  </label>

  <label class="filtros__campo">
    <span class="filtros__etiqueta">Precio máx / noche</span>
    <input
      class="filtros__control"
      type="number"
      min="1"
      placeholder="Precio máx / noche"
      [value]="precioMax ?? ''"
      (input)="alCambiarPrecio($any($event.target).value)"
    />
  </label>

  <button type="button" class="boton boton--contorno filtros__limpiar" (click)="limpiar.emit()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M4 7h16M4 12h16M4 17h10" />
    </svg>
    Limpiar
  </button>
</form>
