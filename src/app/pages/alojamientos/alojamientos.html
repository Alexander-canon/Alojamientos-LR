<main class="contenedor alojamientos">
  <header class="alojamientos__encabezado">
    <h1 class="alojamientos__titulo">Alojamientos disponibles</h1>
    <p class="alojamientos__copia">Encuentra el lugar ideal para tu estancia</p>
  </header>

  <app-filtros
    [ciudades]="ciudades()"
    [tipos]="tipos()"
    [ciudad]="ciudad()"
    [huespedes]="huespedes()"
    [tipo]="tipo()"
    [precioMax]="precioMax()"
    (ciudadChange)="alCambiarCiudad($event)"
    (huespedesChange)="alCambiarHuespedes($event)"
    (tipoChange)="alCambiarTipo($event)"
    (precioMaxChange)="alCambiarPrecioMax($event)"
    (limpiar)="limpiar()"
  />

  @if (filtrados().length > 0) {
    <div class="alojamientos__grilla">
      @for (alojamiento of filtrados(); track alojamiento.id) {
        <app-alojamiento-card [alojamiento]="alojamiento" (verDetalle)="verDetalle($event)" />
      }
    </div>
  } @else {
    <app-estado-vacio
      class="vacio--caja"
      titulo="No se encontraron alojamientos"
      mensaje="Intenta ajustar los filtros de búsqueda."
    />
  }
</main>
